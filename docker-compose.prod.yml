# Production stack for a VPS that already hosts a website.
# api + bot use the host network so they inherit the VPS VPN/tunnel
# (Docker bridge NAT does not). nginx already talks to 127.0.0.1:18000.
# Postgres is published only on 127.0.0.1:${ASF_DB_HOST_PORT:-15432} — never 5432.
name: asf

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: asf
    ports:
      - "127.0.0.1:${ASF_DB_HOST_PORT:-15432}:5432"
    volumes:
      - asf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asf -d asf"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asf_internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ASF_ENV: production
      ASF_DEBUG: "false"
      UPLOAD_DIR: /data/uploads
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      ASF_TELEGRAM_IP: ${ASF_TELEGRAM_IP:-auto}
    volumes:
      - asf_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 127.0.0.1 --port ${ASF_HOST_PORT:-18000} --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ASF_HOST_PORT:-18000}/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ASF_ENV: production
      ASF_DEBUG: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      ASF_TELEGRAM_IP: ${ASF_TELEGRAM_IP:-auto}
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c 'if [ -z "$$TELEGRAM_BOT_TOKEN" ] || [ "$$TELEGRAM_BOT_TOKEN" = "SET_ME" ]; then
               echo "TELEGRAM_BOT_TOKEN missing; bot idle";
               sleep infinity;
             else
               python -m integrations.telegram.bot;
             fi'

volumes:
  asf_pgdata:
  asf_uploads:

networks:
  asf_internal:
    driver: bridge
