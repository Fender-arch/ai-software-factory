# Production stack for a VPS that already hosts a website.
# Binds API only to 127.0.0.1:${ASF_HOST_PORT:-18000} — never 80/443/5432.
name: asf

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: asf
    volumes:
      - asf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asf -d asf"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asf_internal

  egress:
    profiles: ["egress"]
    build:
      context: .
      dockerfile: docker/Dockerfile.egress
    restart: unless-stopped
    environment:
      EGRESS_SSH_HOST: ${EGRESS_SSH_HOST}
      EGRESS_SSH_USER: ${EGRESS_SSH_USER:-root}
      EGRESS_SSH_PORT: ${EGRESS_SSH_PORT:-22}
    volumes:
      - ${ASF_EGRESS_KEY_PATH:-/opt/asf-secrets/egress_id_ed25519}:/run/secrets/egress_id_ed25519:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    networks:
      - asf_internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ASF_ENV: production
      ASF_DEBUG: "false"
      UPLOAD_DIR: /data/uploads
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,egress}
      ASF_TELEGRAM_IP: ${ASF_TELEGRAM_IP:-auto}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:${ASF_HOST_PORT:-18000}:8000"
    volumes:
      - asf_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - asf_internal

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ASF_ENV: production
      ASF_DEBUG: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      LLM_HTTP_PROXY: ${LLM_HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,egress}
      ASF_TELEGRAM_IP: ${ASF_TELEGRAM_IP:-auto}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c 'if [ -z "$$TELEGRAM_BOT_TOKEN" ] || [ "$$TELEGRAM_BOT_TOKEN" = "SET_ME" ]; then
               echo "TELEGRAM_BOT_TOKEN missing; bot idle";
               sleep infinity;
             else
               python -m integrations.telegram.bot;
             fi'
    networks:
      - asf_internal

volumes:
  asf_pgdata:
  asf_uploads:

networks:
  asf_internal:
    driver: bridge
