# Local development only (reload + bind-mount + published 5432/8000).
# VPS: docker-compose.prod.yml — see docs/16-VPS-Deploy.md
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asf
      POSTGRES_PASSWORD: asf
      POSTGRES_DB: asf
    ports:
      - "5432:5432"
    volumes:
      - asf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asf -d asf"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://asf:asf@db:5432/asf
      ASF_ENV: docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  asf_pgdata:
