# Deploy ASF to an existing VPS without taking over ports 80/443.
# Skips until GitHub secrets are filled (placeholder SET_ME is ignored).
name: Deploy VPS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: asf-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      DOMAIN_MINIAPP: ${{ secrets.DOMAIN_MINIAPP }}
      DOMAIN_CONSOLE: ${{ secrets.DOMAIN_CONSOLE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      CONSOLE_TOKEN: ${{ secrets.CONSOLE_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      ASF_HOST_PORT: ${{ secrets.ASF_HOST_PORT }}
      STT_PROVIDER: ${{ secrets.STT_PROVIDER }}
      STT_MODEL: ${{ secrets.STT_MODEL }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - name: Check VPS_HOST is filled
        id: gate
        run: |
          if [ -z "$VPS_HOST" ] || [ "$VPS_HOST" = "SET_ME" ]; then
            echo "VPS_HOST is empty or SET_ME — fill GitHub Actions secrets, then re-run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Pack release
        if: steps.gate.outputs.ready == 'true'
        run: |
          tar --exclude='.git' --exclude='.venv' --exclude='__pycache__' \
              --exclude='.pytest_cache' --exclude='data' --exclude='.env' \
              -C "$GITHUB_WORKSPACE" -czf /tmp/asf-deploy.tgz .
          cp /tmp/asf-deploy.tgz "$GITHUB_WORKSPACE/asf-deploy.tgz"

      - name: Copy archive to VPS
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: asf-deploy.tgz
          target: /tmp/asf-gh-${{ github.run_id }}
          overwrite: true
          timeout: 60s

      - name: Start stack and add ASF vhosts
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          command_timeout: 30m
          envs: VPS_PASSWORD,VPS_DEPLOY_PATH,DOMAIN_MINIAPP,DOMAIN_CONSOLE,TELEGRAM_BOT_TOKEN,OWNER_TELEGRAM_ID,CONSOLE_TOKEN,GROQ_API_KEY,OPENAI_API_KEY,POSTGRES_PASSWORD,LETSENCRYPT_EMAIL,ASF_HOST_PORT,STT_PROVIDER,STT_MODEL,LLM_PROVIDER,LLM_MODEL
          script: |
            set -euo pipefail
            export ASF_TARBALL=/tmp/asf-gh-${{ github.run_id }}/asf-deploy.tgz
            export VPS_DEPLOY_PATH VPS_PASSWORD DOMAIN_MINIAPP DOMAIN_CONSOLE
            export TELEGRAM_BOT_TOKEN OWNER_TELEGRAM_ID CONSOLE_TOKEN
            export GROQ_API_KEY OPENAI_API_KEY POSTGRES_PASSWORD
            export LETSENCRYPT_EMAIL ASF_HOST_PORT STT_PROVIDER STT_MODEL
            export LLM_PROVIDER LLM_MODEL
            DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/asf}"
            if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "SET_ME" ]; then
              DEPLOY_PATH=/opt/asf
              export VPS_DEPLOY_PATH="$DEPLOY_PATH"
            fi
            mkdir -p "$DEPLOY_PATH"
            tar -xzf "$ASF_TARBALL" -C "$DEPLOY_PATH"
            chmod +x "$DEPLOY_PATH"/deploy/*.sh
            bash "$DEPLOY_PATH"/deploy/remote_up.sh
